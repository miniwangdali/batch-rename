[package]
name = "batch-rename-context-menu"
version = "0.3.0"
description = "Windows 11 File Explorer context menu handler for Batch Rename"
authors = ["Xiaoyan Wang <miniwangdali@gmail.com>"]
license = "MIT"
edition = "2024"
publish = false

[lib]
# cdylib is loaded by Explorer; rlib lets the unit tests link against the code.
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"

[dev-dependencies]
tempfile = "3.27.0"
