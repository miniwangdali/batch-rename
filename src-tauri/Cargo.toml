[package]
name = "batch-rename"
version = "0.3.0"
description = "A tiny batch file renamer inspired by PowerToys PowerRename"
authors = ["Xiaoyan Wang <miniwangdali@gmail.com>"]
license = "MIT"
repository = "https://github.com/miniwangdali/batch-rename"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (see rust-lang/cargo#8519).
name = "batch_rename_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
fancy-regex = "0.20.0"
fastrand = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"
